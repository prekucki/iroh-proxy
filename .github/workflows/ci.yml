name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Relay recovery regression tests
        shell: bash
        run: |
          iroh_manifest=$(cargo metadata --locked --format-version 1 | jq -er '.packages[] | select(.name == "iroh") | .manifest_path')
          rustfmt --edition 2024 --check "${iroh_manifest%/*}/src/socket/transports/relay/actor.rs" "${iroh_manifest%/*}/src/socket/transports/relay/recovery_tests.rs"
          cargo test --locked --manifest-path "$iroh_manifest" -p iroh --lib relay_recovery
